# Add to /etc/nginx/sites-enabled/cloudflare-tunnel, then: sudo nginx -t && sudo systemctl reload nginx
# Vacuum on your own hostname (cloudflared-ingress.yml must match)
server {
    listen 127.0.0.1:8080;
    server_name vacuum.example.com;

    # Camera: a long-lived WebSocket (go2rtc video relayed by server.py)
    location = /api/camera/ws {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8094;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/vacuum-access.log;
    error_log /var/log/nginx/vacuum-error.log;
}
