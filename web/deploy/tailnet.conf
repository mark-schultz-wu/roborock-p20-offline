# Drop-in for the tailnet-only phase (before Cloudflare Access):
#   ~/.config/systemd/user/vacuum-web.service.d/tailnet.conf
# Served with `tailscale serve --bg --https=8443 http://127.0.0.1:8094`
# (tailnet only; port 443 on this machine is Funnel = public, never use it).
# Delete this file when moving to Cloudflare Access.
[Service]
Environment=VACUUM_WEB_TAILNET=1
